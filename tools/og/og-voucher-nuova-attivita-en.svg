      <text x="39" y="-3" text-anchor="middle" font-family="Archivo Black" font-size="26" fill="#FFFFFF">UP TO</text>
    </g>
    <g transform="rotate(-5 312 130)">
      <rect x="192" y="102" width="270" height="52" fill="#3B72E9"/>
      <text x="214" y="140" font-family="Archivo Black" font-size="28" fill="#FFFFFF">CASHBACK</text>
      <path d="M412 128 h26 m-10 -10 l10 10 l-10 10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/>
    </g>
