    <text x="990" y="346" text-anchor="middle" font-family="Archivo Black" font-size="78" letter-spacing="-2" fill="#F0F3F9">OPEN</text>
    <rect x="934" y="370" width="9" height="9" fill="#8FB0F5"/>
    <text x="951" y="380" font-family="Manrope" font-weight="700" font-size="19" fill="#8FB0F5">Now online</text>
  </g>
  <!-- The flyer's handwritten line -->
  <g transform="rotate(-6 980 520)" font-family="Caveat" font-weight="600" font-size="34" fill="#0B0E14">
    <text x="880" y="486">More people</text>
    <text x="880" y="520">in the digital world.</text>
    <text x="880" y="554">Together.</text>
    <path d="M882 572 C 930 564, 990 560, 1080 556" fill="none" stroke="#3B72E9" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Top strut -->
  <rect x="0" y="0" width="1200" height="8" fill="#3B72E9"/>
  <!-- Lockup -->
  <g transform="translate(64 44)">
    <text x="0" y="29" font-family="Archivo Black" font-size="37" fill="#0B0E14" textLength="200" lengthAdjust="spacingAndGlyphs">ALPACODE</text>
    <rect x="0" y="35" width="200" height="5.5" fill="#3B72E9"/>
    <text x="0.5" y="56.5" font-family="Manrope" font-weight="800" font-size="12.5" fill="#0B0E14" textLength="199" lengthAdjust="spacing">SOLUZIONI DIGITALI</text>
  </g>
  <!-- Kicker -->
  <rect x="64" y="144" width="24" height="3" fill="#3B72E9"/>
  <text x="100" y="151" font-family="Manrope" font-weight="700" font-size="19" fill="#0B0E14">Refer a friend · New businesses</text>
  <!-- Headline -->
  <g font-family="Archivo Black" font-size="58" letter-spacing="-2" fill="#0B0E14">
    <text x="62" y="220">Know someone</text>
    <text x="62" y="282">who just opened</text>
    <text x="62" y="344"><tspan fill="#3B72E9">a business?</tspan></text>
  </g>
  <text x="64" y="392" font-family="Manrope" font-weight="800" font-size="24" fill="#2756C2">If they become our client, you get</text>
  <!-- Sticker -->
  <g transform="translate(112 474)">
    <g fill="#3B72E9">
      <rect x="-54" y="36" width="30" height="7" transform="rotate(24 -24 39)"/>
      <rect x="-60" y="58" width="30" height="7" transform="rotate(4 -30 61)"/>
      <rect x="-54" y="80" width="30" height="7" transform="rotate(-18 -24 83)"/>
      <rect x="382" y="-12" width="30" height="7" transform="rotate(-50 382 -8)"/>
      <rect x="398" y="8" width="30" height="7" transform="rotate(-24 398 12)"/>
    </g>
    <g transform="rotate(-4 176 56)">
