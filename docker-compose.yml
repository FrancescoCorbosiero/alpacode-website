# Alpacode website — sits behind lucaslorentz/caddy-docker-proxy.
#
# Prereqs: the caddy proxy stack is already up and owns the external
# "caddy" network (CADDY_INGRESS_NETWORKS=caddy). Caddy reads the labels
# below, reverse-proxies the domain to this container and provisions TLS
# automatically via the global ACME email.
#
# Deploy:  docker compose up -d --build
# Domain:  set SITE_DOMAIN (defaults to alpacode.it); point its DNS A/AAAA
#          record at the VPS first so Let's Encrypt can issue a cert.

networks:
  caddy:
    external: true

services:
  alpacode-website:
    build:
      context: .
      args:
        # Inlined at build time (PUBLIC_ = client-side).
        PUBLIC_CALCOM_LINK: "${PUBLIC_CALCOM_LINK:-https://cal.eu/alpacode/30min}"
        PUBLIC_UMAMI_SRC: "${PUBLIC_UMAMI_SRC:-}"
        PUBLIC_UMAMI_ID: "${PUBLIC_UMAMI_ID:-}"
    image: alpacode-website:latest
    container_name: alpacode-website
    restart: unless-stopped
    networks:
      - caddy
    expose:
      - "4321"
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: "production"
      # Contact form delivery via AWS SES — optional. Without AWS_REGION the
      # form still works (the API route logs the submission and returns ok).
      # Omit the keys if the host uses an IAM role / instance profile.
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-info@alpacode.it}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-info@alpacode.it}"
    labels:
      # caddy-docker-proxy: route the domain to this container's :4321 and
      # compress responses. HTTP->HTTPS redirect and TLS are automatic.
      caddy: "${SITE_DOMAIN:-alpacode.it}"
      caddy.reverse_proxy: "{{upstreams 4321}}"
      caddy.encode: "zstd gzip"
      # Security headers. (Hashed /_astro/* assets are already served
      # cache-immutable by the app, so no caching rule is needed here.)
      caddy.header.X-Content-Type-Options: "nosniff"
      caddy.header.Referrer-Policy: "strict-origin-when-cross-origin"
      caddy.header.X-Frame-Options: "SAMEORIGIN"
      caddy.header.Permissions-Policy: "geolocation=(), camera=(), microphone=()"
      caddy.header.Strict-Transport-Security: "max-age=31536000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
