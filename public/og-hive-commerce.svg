        <path d="M25.98 -15 L51.96 0 L51.96 30 L25.98 45 L0 30 L0 0 Z"/>
        <path d="M0 30 L25.98 45 L25.98 75 L0 90 L-25.98 75 L-25.98 45 Z"/>
        <path d="M51.96 30 L77.94 45 L77.94 75 L51.96 90 L25.98 75 L25.98 45 Z"/>
